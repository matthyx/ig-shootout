kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ig-shootout
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "namespaces", "configmaps"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["spdx.softwarecomposition.kubescape.io"]
    resources: ["applicationprofiles", "networkneighborhoods", "seccompprofiles"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["spdx.softwarecomposition.kubescape.io"]
    resources: ["containerprofiles", "sbomsyfts"]
    verbs: ["create", "get", "update", "watch", "list", "patch"]
  - apiGroups: ["kubescape.io"]
    resources: ["runtimerulealertbindings"]
    verbs: ["list", "watch"]
  - apiGroups: ["kubescape.io"]
    resources: ["operatorcommands"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["kubescape.io"]
    resources: ["operatorcommands/status"]
    verbs: ["get", "watch", "list", "update", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "get"]
