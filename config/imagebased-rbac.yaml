apiVersion: v1
kind: ServiceAccount
metadata:
  name: imagebased
  namespace: ig-shootout
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ig-shootout-imagebased
rules:
  # Required by kubemanager to get node information
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Required by kubemanager to track pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Required by kubemanager to get namespace information
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Required by kubemanager to get service information for enrichment
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Required to get ReplicaSet owner references for pod enrichment
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Required to get Deployment owner references for pod enrichment
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # Required to get DaemonSet owner references for pod enrichment
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch"]
  # Required to get StatefulSet owner references for pod enrichment
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  # Required to get Job owner references for pod enrichment
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # Required to get CronJob owner references for pod enrichment
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ig-shootout-imagebased
subjects:
  - kind: ServiceAccount
    name: imagebased
    namespace: ig-shootout
roleRef:
  kind: ClusterRole
  name: ig-shootout-imagebased
  apiGroup: rbac.authorization.k8s.io
